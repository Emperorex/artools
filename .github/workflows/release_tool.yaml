name: Manual Tool Release

on:
  workflow_dispatch:
    inputs:
      tool_name:
        description: 'Select the tool to release'
        required: true
        default: 'arfind'
        type: choice
        options:
          - arfind
          - ardisk
          - argrep
jobs:
  build:
    name: Build Binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_suffix: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_suffix: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_suffix: macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Dynamic dependency caching based on user-selected tool path
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "."

      # musl-tools package required to produce statically linked Linux binaries
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Build production binary
      - name: Build Release Binary
        run: |
          cargo build --release --target ${{ matrix.target }} --bin ${{ inputs.tool_name }}

      # Codesign macOS binary with ad-hoc signature to mitigate Gatekeeper kills
      - name: Codesign macOS Binary
        if: matrix.os == 'macos-latest'
        run: |
          codesign -s - "target/${{ matrix.target }}/release/${{ inputs.tool_name }}"

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ inputs.tool_name }} \
             dist/${{ inputs.tool_name }}-${{ matrix.artifact_suffix }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.tool_name }}-${{ matrix.artifact_suffix }}
          path: dist/${{ inputs.tool_name }}-${{ matrix.artifact_suffix }}

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required for proper tag push and historical log diff analysis
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Extract version metadata dynamically from Cargo.toml
      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version' tools/${{ inputs.tool_name }}/Cargo.toml | head -n1 | cut -d '"' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=${{ inputs.tool_name }}-v$VERSION" >> $GITHUB_ENV

      # Generate and push a physical Git tag into the repository history
      - name: Create and Push Git Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if the tag already exists to prevent pipeline crashes
          if git rev-parse "${{ env.TAG_NAME }}" >/dev/null 2>&1; then
            echo "Tag ${{ env.TAG_NAME }} already exists. Skipping tag creation."
          else
            git tag -a "${{ env.TAG_NAME }}" -m "Release ${{ inputs.tool_name }} v${{ env.VERSION }}"
            git push origin "${{ env.TAG_NAME }}"
          fi

      # Find the previous release tag for this specific tool to use as the
      # commit range start point. Falls back to the first commit if no prior tag exists.
      - name: Generate tool-scoped release notes
        id: release_notes
        run: |
          TOOL="${{ inputs.tool_name }}"
          CURRENT_TAG="${{ env.TAG_NAME }}"

          # Find the most recent previous tag for this tool (e.g. arfind-v0.1.1)
          PREV_TAG=$(git tag --list "${TOOL}-v*" --sort=-version:refname \
            | grep -v "^${CURRENT_TAG}$" \
            | head -n1)

          if [ -z "$PREV_TAG" ]; then
            # No previous tag — include all commits touching this tool's directory
            RANGE=""
            echo "No previous tag found for ${TOOL}, using full history."
          else
            RANGE="${PREV_TAG}..HEAD"
            echo "Generating notes from ${PREV_TAG} to HEAD"
          fi

          # Collect only commits that touched files under tools/<tool>/
          # --follow-renames handles file moves across the history
          COMMITS=$(git log ${RANGE} \
            --pretty=format:"- %s (%h)" \
            -- "tools/${TOOL}/" \
            | head -50)

          if [ -z "$COMMITS" ]; then
            COMMITS="- No changes specific to \`${TOOL}\` since the last release."
          fi

          # Write multi-line output safely using the GITHUB_OUTPUT heredoc syntax
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "## What's Changed in \`${TOOL}\`"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "**Full changelog:** https://github.com/${{ github.repository }}/commits/main/tools/${TOOL}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ inputs.tool_name }} v${{ env.VERSION }}
          body: ${{ steps.release_notes.outputs.notes }}
          generate_release_notes: false
          files: |
            dist/${{ inputs.tool_name }}-linux-x86_64
            dist/${{ inputs.tool_name }}-macos-arm64
            dist/${{ inputs.tool_name }}-macos-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
