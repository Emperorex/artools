name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only token by default; no job here needs to write anything.
permissions:
  contents: read

jobs:
  html-lint:
    name: HTML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config for later steps to read.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 18 reached end of life in April 2025; 24 is the current LTS.
          node-version: '24'

      # Exact versions of htmlhint and all its dependencies come from
      # .github/htmlhint/package-lock.json (with integrity hashes); npm ci
      # installs exactly that tree or fails. Install scripts are not run.
      - name: Install htmlhint
        run: npm ci --prefix .github/htmlhint --ignore-scripts --no-audit --no-fund

      - name: Run htmlhint
        run: |
          echo "Running htmlhint..."
          # allow git ls-files to fail without stopping the step
          set +e
          files=$(git ls-files '*.html')
          set -e
          if [ -z "${files}" ]; then
            echo "No HTML files found, skipping htmlhint."
            exit 0
          fi
          # Run htmlhint on the matched HTML files
          .github/htmlhint/node_modules/.bin/htmlhint ${files}

  rust-lint:
    name: Rust lint (clippy & fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config for later steps to read.
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Run fmt and clippy on all tools
        run: |
          echo "Scanning for Rust projects in tools/..."
          
          # Find every folder in tools/ and crates/ that has a Cargo.toml
          for cargo_toml in tools/*/Cargo.toml crates/*/Cargo.toml; do
            # Check that the file really exists (in case a folder is empty and the glob didn't match)
            [ -e "$cargo_toml" ] || continue
          
            # Get the project's folder (e.g. tools/arfind)
            project_dir=$(dirname "$cargo_toml")
            echo "----------------------------------------"
            echo "Linting Rust project in: $project_dir"
            echo "----------------------------------------"
          
            # Check formatting
            cargo fmt --manifest-path "$cargo_toml" --check
          
            # Run clippy against this project's own manifest
            cargo clippy --manifest-path "$cargo_toml" -- -D warnings
          done
