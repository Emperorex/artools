[package]
name = "ardisk"
version = "0.2.2"
edition = "2024"
authors = ["Artem Shemet"]
description = "Fast parallel disk usage analyzer"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
glob = "0.3"
crossbeam-channel = "0.5"
colored = "3.1"
ignore = "0.4"
blake3 = "1"

[dev-dependencies]
tempfile = "3"
