name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only token by default; no job here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.tool }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [ arfind, ardisk, argrep ]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config for later steps to read.
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "tools/${{ matrix.tool }}"

      - name: Run tests
        run: cargo test --manifest-path tools/${{ matrix.tool }}/Cargo.toml
