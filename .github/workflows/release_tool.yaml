name: Manual Tool Release

on:
  workflow_dispatch:
    inputs:
      tool_name:
        description: 'Select the tool to release'
        required: true
        default: 'arfind'
        type: choice
        options:
          - arfind
          - ardisk
          - argrep

# Nothing by default; each job below asks for exactly what it needs.
permissions: {}

jobs:
  # Gate for the whole release: nothing is built, attested or published
  # unless this passes. Two independent checks:
  #  * the run must be on main, so no release can come from an unreviewed
  #    branch (workflow_dispatch otherwise accepts any branch);
  #  * the job uses the protected "release" environment, so its rules
  #    (required reviewers, deployment branch = main) apply. Configure it
  #    in Settings > Environments; see the commit message.
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Require the main branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases are only built from main (this run is on $REF)."
            exit 1
          fi

  build:
    name: Build Binary
    needs: release-gate
    runs-on: ${{ matrix.os }}
    # Values used inside run: scripts are passed as environment variables
    # rather than pasted in with ${{ }}, so they can never become shell code.
    env:
      TOOL: ${{ inputs.tool_name }}
      TARGET: ${{ matrix.target }}
      SUFFIX: ${{ matrix.artifact_suffix }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact_suffix: linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_suffix: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_suffix: macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config for later steps to read.
          persist-credentials: false

      # Pinned to a commit like every other action here: this job can mint
      # provenance attestations, so nothing a tag owner changes may run in
      # it. v1 at this commit is the same code as @stable; the toolchain is
      # named explicitly because only the stable branch defaults it.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No build cache in the release job, on purpose: a cache restored from
      # another workflow run could feed tampered build outputs into a binary
      # that then gets a valid attestation. Release builds always start clean.

      # musl-tools package required to produce statically linked Linux binaries
      # (apt installs the musl toolchain matching the runner's own architecture,
      # so this covers both the x86_64 and arm64 Linux runners)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # Build production binary
      - name: Build Release Binary
        run: |
          cargo build --release --target "$TARGET" --bin "$TOOL"

      # Codesign macOS binary with ad-hoc signature to mitigate Gatekeeper kills
      - name: Codesign macOS Binary
        if: matrix.os == 'macos-latest'
        run: |
          codesign -s - "target/$TARGET/release/$TOOL"

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/$TOOL" "dist/$TOOL-$SUFFIX"

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.tool_name }}-${{ matrix.artifact_suffix }}
          path: dist/${{ inputs.tool_name }}-${{ matrix.artifact_suffix }}

      # Signed SLSA build provenance, tied to this exact workflow run and
      # commit. Backed by Sigstore's public-good instance (no keys for us
      # to manage) and verifiable by anyone with the gh CLI:
      #   gh attestation verify <file> --repo Emperorex/artools
      # This is a real answer to "did this binary actually come from this
      # repo's CI", not just "does it match a hash someone else could have
      # also tampered with alongside the binary".
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ inputs.tool_name }}-${{ matrix.artifact_suffix }}

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      TOOL: ${{ inputs.tool_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required for proper tag push and historical log diff analysis
          fetch-depth: 0
          # Credentials are kept on purpose in this one job: the "Create and
          # Push Git Tag" step below pushes with them. Every other checkout
          # sets persist-credentials: false.

      - name: Download All Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # SHA256SUMS is the minimum bar: it lets the installer (and anyone
      # downloading manually) verify a binary wasn't corrupted or swapped
      # in transit, without needing any extra tooling beyond sha256sum/
      # shasum, which ship with essentially every Linux/macOS install.
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum "$TOOL-linux-x86_64" \
                     "$TOOL-linux-arm64" \
                     "$TOOL-macos-arm64" \
                     "$TOOL-macos-x86_64" > SHA256SUMS
          cat SHA256SUMS

      # Attest the checksums file itself too: this proves SHA256SUMS came
      # from this repo's release workflow, not just that a binary matches
      # whatever hash happens to sit next to it in the release.
      - name: Attest SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/SHA256SUMS

      # Extract version metadata dynamically from Cargo.toml
      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version' "tools/$TOOL/Cargo.toml" | head -n1 | cut -d '"' -f2)
          # The version becomes part of a tag name and the release title, so
          # accept only a plain semantic version.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::Unexpected version '$VERSION' in tools/$TOOL/Cargo.toml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TOOL-v$VERSION" >> "$GITHUB_ENV"

      # Generate and push a physical Git tag into the repository history
      - name: Create and Push Git Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if the tag already exists to prevent pipeline crashes
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists. Skipping tag creation."
          else
            git tag -a "$TAG_NAME" -m "Release $TOOL v$VERSION"
            git push origin "$TAG_NAME"
          fi

      # Find the previous release tag for this specific tool to use as the
      # commit range start point. Falls back to the first commit if no prior tag exists.
      - name: Generate tool-scoped release notes
        id: release_notes
        run: |
          CURRENT_TAG="$TAG_NAME"

          # Find the most recent previous tag for this tool (e.g. arfind-v0.1.1)
          PREV_TAG=$(git tag --list "${TOOL}-v*" --sort=-version:refname \
            | grep -v "^${CURRENT_TAG}$" \
            | head -n1)

          if [ -z "$PREV_TAG" ]; then
            # No previous tag — include all commits touching this tool's directory
            RANGE=()
            echo "No previous tag found for ${TOOL}, using full history."
          else
            RANGE=("${PREV_TAG}..HEAD")
            echo "Generating notes from ${PREV_TAG} to HEAD"
          fi

          # Commits that touched this tool's own files.
          COMMITS=$(git log "${RANGE[@]}" \
            --pretty=format:"- %s (%h)" \
            -- "tools/${TOOL}/" \
            | head -50)

          # Commits to shared library code under crates/ (e.g. arcommon) are
          # compiled into every tool, so they belong in its notes too. Listed
          # separately, and only those not already listed above.
          TOOL_SHAS=$(git log "${RANGE[@]}" --pretty=format:%H -- "tools/${TOOL}/")
          SHARED=""
          for sha in $(git log "${RANGE[@]}" --pretty=format:%H -- "crates/" | head -50); do
            if ! printf '%s\n' "$TOOL_SHAS" | grep -qx "$sha"; then
              SHARED="${SHARED}$(git log -1 --pretty=format:"- %s (%h)" "$sha")"$'\n'
            fi
          done

          if [ -z "$COMMITS" ] && [ -z "$SHARED" ]; then
            COMMITS="- No changes to \`${TOOL}\` since the last release."
          fi

          # Write multi-line output safely using the GITHUB_OUTPUT heredoc syntax
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "## What's Changed in \`${TOOL}\`"
            echo ""
            if [ -n "$COMMITS" ]; then
              echo "$COMMITS"
              echo ""
            fi
            if [ -n "$SHARED" ]; then
              echo "### Shared code (\`crates/\`)"
              echo ""
              printf '%s' "$SHARED"
              echo ""
            fi
            echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/commits/main/tools/${TOOL}"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ inputs.tool_name }} v${{ env.VERSION }}
          body: ${{ steps.release_notes.outputs.notes }}
          generate_release_notes: false
          files: |
            dist/${{ inputs.tool_name }}-linux-x86_64
            dist/${{ inputs.tool_name }}-linux-arm64
            dist/${{ inputs.tool_name }}-macos-arm64
            dist/${{ inputs.tool_name }}-macos-x86_64
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
