[package]
name = "argrep"
version = "0.1.4"
edition = "2024"
authors = ["Artem Shemet"]
description = "Fast parallel text search utility"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
crossbeam-channel = "0.5"
colored = "3.1"
glob = "0.3"
ignore = "0.4"

[dev-dependencies]
tempfile = "3"
