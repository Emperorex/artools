[package]
name = "arfind"
version = "0.2.6"
edition = "2024"
authors = ["Artem Shemet"]

[dependencies]
arcommon = { path = "../../crates/arcommon" }
clap = { version = "4", features = ["derive"] }
glob = "0.3"
crossbeam-channel = "0.5"
colored = "3.1"
ignore = "0.4"
# --execdir: openat(O_NOFOLLOW) and fchdir (already in the tree via other crates)
libc = "0.2"

[dev-dependencies]
tempfile = "3"
