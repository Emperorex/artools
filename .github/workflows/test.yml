name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only token by default; no job here needs to write anything.
permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.tool }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [ arfind, ardisk, argrep, arcommon ]
        include:
          - { tool: arfind, path: tools/arfind }
          - { tool: ardisk, path: tools/ardisk }
          - { tool: argrep, path: tools/argrep }
          # Shared library used by all three tools
          - { tool: arcommon, path: crates/arcommon }

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config for later steps to read.
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Rust Cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "${{ matrix.path }}"

      - name: Run tests
        run: cargo test --manifest-path ${{ matrix.path }}/Cargo.toml
