[package]
name = "argrep"
version = "0.2.4"
edition = "2024"
authors = ["Artem Shemet"]
description = "Fast parallel text search utility"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
crossbeam-channel = "0.5"
colored = "3.1"
glob = "0.3"
ignore = "0.4"
regex = "1"
# rust_backend (miniz_oxide) explicitly selected, rather than relying on
# flate2's own default, so -z/--search-compressed never pulls in a system
# zlib dependency or needs a C toolchain to build.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3"
