name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  html-lint:
    name: HTML lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '18'

      - name: Install htmlhint
        run: npm install -g htmlhint

      - name: Run htmlhint
        run: |
          echo "Running htmlhint..."
          # allow git ls-files to fail without stopping the step
          set +e
          files=$(git ls-files '*.html')
          set -e
          if [ -z "${files}" ]; then
            echo "No HTML files found, skipping htmlhint."
            exit 0
          fi
          # Run htmlhint on the matched HTML files
          htmlhint ${files}

  rust-lint:
    name: Rust lint (clippy & fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Run fmt and clippy on all tools
        run: |
          echo "Scanning for Rust projects in tools/..."
          
          # Знаходимо всі папки в tools/, де є Cargo.toml
          for cargo_toml in tools/*/Cargo.toml; do
            # Перевіряємо, чи файл дійсно існує (на випадок порожньої папки)
            [ -e "$cargo_toml" ] || continue
          
            # Отримуємо шлях до папки проєкту (наприклад, tools/arfind)
            project_dir=$(dirname "$cargo_toml")
            echo "----------------------------------------"
            echo "Linting Rust project in: $project_dir"
            echo "----------------------------------------"
          
            # Запускаємо перевірку форматування
            cargo fmt --manifest-path "$cargo_toml" --check
          
            # Запускаємо clippy, вказуючи шлях до конкретного маніфесту
            cargo clippy --manifest-path "$cargo_toml" -- -D warnings
          done
